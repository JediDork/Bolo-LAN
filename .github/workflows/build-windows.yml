name: Build Windows Distribution

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Compile and test game logic
        run: |
          python -m compileall -q launcher.py client.py server.py shared.py terrain.py effects.py display.py renderer.py audio.py test_server.py test_render.py
          python -m unittest discover -p "test_*.py" -v
      - name: Build game and server executables
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name BoloLAN launcher.py
          pyinstaller --noconfirm --clean --onefile --console --name BoloLAN-Server server.py
      - name: Assemble distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/BoloLAN.exe package/
          Copy-Item dist/BoloLAN-Server.exe package/
          Copy-Item README.md package/
          Copy-Item Start-BoloLAN.ps1 package/
          @'
          Bolo-LAN — Windows distribution test

          1. Launch BoloLAN.exe on each LAN PC.
          2. It joins an existing game or automatically becomes the host.
          3. Optional: BoloLAN-Server.exe runs a dedicated host without a player.
          4. If discovery fails, launch the client in PowerShell with:
             .\BoloLAN.exe --host 192.168.1.100
             (replace with the server's LAN IPv4 address).

          Allow inbound UDP 50000 through Windows Firewall on the host.
          No Python installation required.
          '@ | Set-Content package/START-HERE.txt
      - name: Publish Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BoloLAN-Windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 30
